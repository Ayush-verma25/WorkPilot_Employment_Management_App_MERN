<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">WorkPilot premium favicon</title>
  <desc id="desc">Glassmorphism gradient WorkPilot navigation mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset=".5" stop-color="#172554"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset=".45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#glass)"/>
  <ellipse cx="23" cy="13" rx="17" ry="8" fill="#FFFFFF" opacity=".10"/>

  <path d="M32 12 L50 51 L32 42 L14 51 Z" fill="url(#accent)" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 12 V42" stroke="#FFFFFF" stroke-opacity=".95" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="33" r="5" fill="#FFFFFF"/>
  <circle cx="32" cy="33" r="2.5" fill="#2563EB"/>
</svg>